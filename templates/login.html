{% extends 'base.html' %}
{% block title %}Sign In • Habit Tracker{% endblock %}

{% block content %}
<div class="pt-16 pb-8 space-y-6">
    <div class="text-center">
        <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-iosBlue to-iosPurple flex items-center justify-center mx-auto shadow-xl shadow-iosBlue/20 text-white mb-4">
            <i data-lucide="repeat" class="w-8 h-8 stroke-[2.5]"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-white">HabitLoop</h1>
        <p class="text-xs text-slate-400 mt-1">Consistent small changes lead to remarkable results</p>
    </div>

    <form method="POST" class="bg-iosCard border border-iosBorder rounded-3xl p-5 space-y-3.5 shadow-xl">
        <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Email</label>
            <input type="email" name="email" required placeholder="name@example.com"
                   class="w-full bg-iosCardSubtle border border-iosBorder rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-iosBlue">
        </div>
        <div>
            <label class="block text-[11px] font-semibold text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••"
                   class="w-full bg-iosCardSubtle border border-iosBorder rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-iosBlue">
        </div>
        <button type="submit" class="w-full py-3 rounded-2xl bg-iosBlue font-bold text-sm text-white shadow-md shadow-iosBlue/25 hover:bg-blue-600 transition">
            Continue
        </button>
    </form>

    <div class="text-center">
        <a href="{{ url_for('register') }}" class="text-xs text-slate-400 hover:text-white">New user? <span class="text-iosBlue font-semibold">Create an account</span></a>
    </div>
</div>
{% endblock %}
